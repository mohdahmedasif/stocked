name: stocked

services:
  stocked:
    build: .
    image: stocked:latest
    container_name: stocked-app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Inside the container the app always listens on 3000; PORT from
      # .env only chooses the port published on the host (see "ports" above).
      PORT: "3000"
    volumes:
      - stocked-data:/data
    restart: unless-stopped

volumes:
  stocked-data:
    name: stocked-data
