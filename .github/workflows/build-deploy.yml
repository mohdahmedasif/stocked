# Tests every push and pull request. A passing push to main builds a release:
# the client is compiled here, production dependencies are installed here, and
# one tarball is attached to a GitHub release. The server only downloads it.
name: Test and build release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch; a newer push cancels the older run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Type-check and build client
        working-directory: client
        run: npm run build

  release:
    needs: test
    # Only a passing push to main becomes a release; pull requests stop after tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Same OS and Node major as the server, so native modules match.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Copy client into server
        run: node scripts/copy-client-dist.cjs

      - name: Install production server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Assemble release
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p stage/server
          cp -a server/src server/dist server/node_modules server/package.json stage/server/
          echo "$SHA" > stage/server/BUILD
          tar -czf stocked.tar.gz -C stage server
          ls -lh stocked.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="build-${SHA::7}"
          gh release create "$TAG" stocked.tar.gz \
            --title "Build ${SHA::7}" \
            --notes "Built from commit ${SHA}." \
            --target "$SHA" \
            --latest
